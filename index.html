<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAF IN PUTRAA NYAKK</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff6ec7,#ff9a9e,#fad0c4,#fbc2eb);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:360px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(15px);
border:2px solid rgba(255,255,255,.3);
text-align:center;
box-shadow:0 0 40px rgba(255,105,180,.5);
animation:muncul .8s;
position:relative;
z-index:2;
}

@keyframes muncul{
from{transform:scale(.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}

h1{
font-size:34px;
color:#fff;
text-shadow:0 0 10px hotpink;
}

p{
margin-top:15px;
color:#fff;
font-size:18px;
line-height:1.7;
}

.face{
font-size:90px;
animation:lompat 1.2s infinite;
}

@keyframes lompat{
50%{transform:translateY(-12px) rotate(-8deg);}
}

button{
padding:14px 28px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin:12px;
transition:.3s;
font-weight:bold;
}

#yes{
background:#ff2d75;
color:white;
box-shadow:0 0 20px #ff2d75;
}

#yes:hover{
transform:scale(1.1);
}

#no{
background:#ffffff;
color:#ff2d75;
position:absolute;
}

.heart{
position:absolute;
color:pink;
animation:naik linear infinite;
pointer-events:none;
}

@keyframes naik{
0%{
transform:translateY(100vh) scale(.5);
opacity:1;
}
100%{
transform:translateY(-100px) scale(1.5);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<div class="face">🥺</div>

<h1>Maafin Aku Ya...</h1>

<p>
iyaa tau ko putra salah hehe<br><br>

Kalau teteh belum bisa maafin sekarang,
gak apa-apa...<br>
</p>

<button id="yes">💖 Maafin</button>
<button id="no">😤 Nggak</button>

</div>

<script>
const no=document.getElementById("no");

no.addEventListener("mouseover",()=>{

let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";
no.style.top=y+"px";

});

document.getElementById("yes").onclick=function(){

document.body.innerHTML=`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
background:linear-gradient(135deg,#ff4d88,#ff8fab,#ffc2d1);
color:white;
text-align:center;
animation:muncul .8s;
">

<h1 style="font-size:55px;">YEAYYY!!</h1>

<div style="font-size:120px;">🎉💖</div>

<h2>Makasih Udah Maafin Aku</h2>

<p style="font-size:22px;margin-top:15px;">
SEKARANG BAIKAN YAAAAKKK<br>
AND KALO MAU CALL YU KITA CALL SAMPE SUBUH😭
</p>

</div>
`;

for(let i=0;i<120;i++){

let h=document.createElement("div");
h.innerHTML="💖";
h.style.position="absolute";
h.style.left=Math.random()*100+"vw";
h.style.top=Math.random()*100+"vh";
h.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(h);

}

};

function hati(){

let h=document.createElement("div");

h.className="heart";
h.innerHTML=["💖","💕","❤️","🌸","✨"][Math.floor(Math.random()*5)];

h.style.left=Math.random()*100+"vw";
h.style.fontSize=(15+Math.random()*35)+"px";
h.style.animationDuration=(3+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},7000);

}

setInterval(hati,200);

</script>

</body>
</html>
